version: '4.0'
design: realistic_underwriting_rule_engine_v2
generated_rules: 30
minimum_target: 5000
categories:
  - income_stability
  - affordability
  - expense_behavior
  - liquidity_stress
  - debt_behavior
  - policy_overrides

weight_distribution:
  income_stability: 0.25
  affordability: 0.30
  expense_behavior: 0.15
  liquidity_stress: 0.15
  debt_behavior: 0.10
  policy_overrides: 0.05

decision_logic:
  approve_bias: stable_income_and_surplus
  reject_bias: severe_affordability_or_structural_stress
  note: rule score is blended with model confidence; no single minor signal should dominate.

rules:
  - rule_id: R20001
    id: R20001
    category: income_stability
    subcategory: salary_presence_strong
    condition: metric_salary_months >= 9 and salary_salary_detection_tier in ['stable', 'strong']
    severity: low
    score_impact: 0.08
    reason: long salary history improves repayment reliability

  - rule_id: R20002
    id: R20002
    category: income_stability
    subcategory: salary_presence_moderate
    condition: metric_salary_months >= 6 and salary_salary_detection_tier in ['stable', 'strong']
    severity: low
    score_impact: 0.05
    reason: moderate salary continuity supports affordability

  - rule_id: R20003
    id: R20003
    category: income_stability
    subcategory: weak_income_signal
    condition: salary_salary_detection_tier in ['critical', 'high'] and metric_net_savings_ratio < 0.05
    severity: high
    score_impact: -0.08
    reason: weak formal income with low savings buffer increases uncertainty

  - rule_id: R20004
    id: R20004
    category: income_stability
    subcategory: salary_consistency_bonus
    condition: salary_salary_consistency_tier in ['stable', 'strong']
    severity: low
    score_impact: 0.04
    reason: consistent income periodicity lowers payment disruption risk

  - rule_id: R20005
    id: R20005
    category: income_stability
    subcategory: salary_consistency_risk
    condition: salary_salary_consistency_tier in ['critical', 'high'] and metric_emi_to_income_ratio >= 0.45
    severity: high
    score_impact: -0.09
    reason: unstable income timing under elevated EMI load is risky

  - rule_id: R20006
    id: R20006
    category: income_stability
    subcategory: income_variability_risk
    condition: metric_income_consistency_score <= 0.35 and metric_net_savings_ratio < 0.05
    severity: medium
    score_impact: -0.06
    reason: volatile income with thin surplus reduces repayment confidence

  - rule_id: R20007
    id: R20007
    category: affordability
    subcategory: strong_foir_band
    condition: metric_emi_to_income_ratio <= 0.30
    severity: low
    score_impact: 0.10
    reason: low EMI to income ratio indicates strong affordability

  - rule_id: R20008
    id: R20008
    category: affordability
    subcategory: acceptable_foir_band
    condition: metric_emi_to_income_ratio > 0.30 and metric_emi_to_income_ratio <= 0.40
    severity: low
    score_impact: 0.04
    reason: moderate EMI ratio is acceptable with stable cash flow

  - rule_id: R20009
    id: R20009
    category: affordability
    subcategory: elevated_foir
    condition: metric_emi_to_income_ratio > 0.40 and metric_emi_to_income_ratio <= 0.55
    severity: medium
    score_impact: -0.08
    reason: elevated EMI load narrows repayment headroom

  - rule_id: R20010
    id: R20010
    category: affordability
    subcategory: stressed_foir
    condition: metric_emi_to_income_ratio > 0.55
    severity: critical
    score_impact: -0.16
    reason: EMI burden is unsustainably high relative to income

  - rule_id: R20011
    id: R20011
    category: affordability
    subcategory: strong_surplus
    condition: metric_net_surplus_after_emi >= 10000
    severity: low
    score_impact: 0.08
    reason: strong post-EMI surplus improves resilience to shocks

  - rule_id: R20012
    id: R20012
    category: affordability
    subcategory: moderate_surplus
    condition: metric_net_surplus_after_emi >= 3000 and metric_net_surplus_after_emi < 10000
    severity: low
    score_impact: 0.04
    reason: positive post-EMI surplus supports repayment continuity

  - rule_id: R20013
    id: R20013
    category: affordability
    subcategory: deficit_after_emi
    condition: metric_net_surplus_after_emi < 0
    severity: critical
    score_impact: -0.15
    reason: structural monthly deficit after EMI is a primary default indicator

  - rule_id: R20014
    id: R20014
    category: affordability
    subcategory: loan_size_aligned
    condition: metric_loan_size_sensitivity <= 0.60
    severity: low
    score_impact: 0.05
    reason: requested loan is proportionate to annualized inflow

  - rule_id: R20015
    id: R20015
    category: affordability
    subcategory: loan_size_stretched
    condition: metric_loan_size_sensitivity > 1.00
    severity: high
    score_impact: -0.10
    reason: loan size is high relative to annualized inflow

  - rule_id: R20016
    id: R20016
    category: expense_behavior
    subcategory: efficient_expense_profile
    condition: metric_expense_to_income_ratio <= 0.60
    severity: low
    score_impact: 0.05
    reason: controlled expenses leave room for debt servicing

  - rule_id: R20017
    id: R20017
    category: expense_behavior
    subcategory: expense_pressure
    condition: metric_expense_to_income_ratio > 0.85
    severity: high
    score_impact: -0.09
    reason: high recurring expenses materially reduce debt capacity

  - rule_id: R20018
    id: R20018
    category: expense_behavior
    subcategory: savings_buffer_good
    condition: metric_net_savings_ratio >= 0.12
    severity: low
    score_impact: 0.08
    reason: healthy savings ratio supports stable installment servicing

  - rule_id: R20019
    id: R20019
    category: expense_behavior
    subcategory: savings_buffer_thin
    condition: metric_net_savings_ratio >= 0.0 and metric_net_savings_ratio < 0.05
    severity: medium
    score_impact: -0.06
    reason: thin savings leaves limited room for repayment shocks

  - rule_id: R20020
    id: R20020
    category: expense_behavior
    subcategory: structural_negative_savings
    condition: metric_net_savings_ratio < 0.0
    severity: high
    score_impact: -0.11
    reason: persistent negative savings indicates unsustainable cash flow

  - rule_id: R20021
    id: R20021
    category: liquidity_stress
    subcategory: low_balance_contextual_risk
    condition: stress_low_balance_tier in ['critical', 'high'] and metric_net_savings_ratio < 0.0 and metric_emi_to_income_ratio > 0.50
    severity: high
    score_impact: -0.09
    reason: low balances are concerning when combined with deficit and high EMI load

  - rule_id: R20022
    id: R20022
    category: liquidity_stress
    subcategory: healthy_liquidity_buffer
    condition: stress_low_balance_tier in ['stable', 'strong'] and metric_min_balance >= 10000
    severity: low
    score_impact: 0.06
    reason: durable balance cushion improves repayment confidence

  - rule_id: R20023
    id: R20023
    category: liquidity_stress
    subcategory: month_end_stress
    condition: cashflow_month_end_stress_tier in ['critical', 'high']
    severity: medium
    score_impact: -0.06
    reason: repeated month-end tightness raises missed-payment probability

  - rule_id: R20024
    id: R20024
    category: debt_behavior
    subcategory: hidden_loan_obligation
    condition: emi_hidden_loan_tier in ['critical', 'high']
    severity: critical
    score_impact: -0.13
    reason: hidden liabilities materially alter repayment capacity

  - rule_id: R20025
    id: R20025
    category: debt_behavior
    subcategory: active_emi_load
    condition: emi_emi_deduction_tier in ['critical', 'high'] and metric_emi_to_income_ratio > 0.45
    severity: high
    score_impact: -0.08
    reason: existing EMI obligations plus elevated new EMI ratio increase burden

  - rule_id: R20026
    id: R20026
    category: debt_behavior
    subcategory: digital_short_term_stress
    condition: digital_digital_lending_usage_tier in ['critical', 'high'] or digital_bnpl_dependency_tier in ['critical', 'high']
    severity: medium
    score_impact: -0.06
    reason: high short-term digital borrowing indicates liquidity dependence

  - rule_id: R20027
    id: R20027
    category: debt_behavior
    subcategory: disciplined_bill_behavior
    condition: bill_bill_regular_tier in ['stable', 'strong']
    severity: low
    score_impact: 0.03
    reason: regular utility payments signal payment discipline

  - rule_id: R20028
    id: R20028
    category: debt_behavior
    subcategory: high_risk_discretionary_spend
    condition: lifestyle_addiction_tier in ['critical', 'high']
    severity: high
    score_impact: -0.09
    reason: sustained high-risk discretionary spending increases delinquency risk

  - rule_id: R20029
    id: R20029
    category: policy_overrides
    subcategory: high_quality_profile_boost
    condition: metric_salary_months >= 9 and metric_net_savings_ratio >= 0.12 and metric_emi_to_income_ratio <= 0.35 and stress_low_balance_tier in ['stable', 'strong']
    severity: low
    score_impact: 0.09
    reason: strong multi-signal profile supports confident approvals

  - rule_id: R20030
    id: R20030
    category: policy_overrides
    subcategory: reject_guardrail
    condition: metric_emi_to_income_ratio > 0.60 and metric_net_surplus_after_emi < 0 and metric_loan_size_sensitivity > 1.20
    severity: critical
    score_impact: -0.18
    reason: severe affordability stress across multiple core indicators warrants rejection