services:
  backend:
    build:
      context: .
      dockerfile: Backend/Dockerfile
    image: creditshield-backend:latest
    container_name: creditshield-backend
    ports:
      - "8000:8000"
      - "3001:3001"
    environment:
      BACKEND_PORT: "8000"
      OTP_PORT: "3001"
      APP_ENV: "development"
      PORT: "3001"
    env_file:
      - Backend/.env
    restart: unless-stopped

  frontend:
    build:
      context: ./Design Loan Origination Dashboard
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: "/"
    image: creditshield-frontend:latest
    container_name: creditshield-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
